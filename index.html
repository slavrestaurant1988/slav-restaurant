<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجموعة مطاعم سلاف - Slav Restaurants</title>
    <!-- استدعاء خطوط وأيقونات FontAwesome للأزرار -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif, Tahoma, Arial;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #111;
        }

        /* طبقة خلفية صورة المطعم مع تدرج داكن لتوضيح الأزرار واللوجو */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('515438298_1276468394490333_8021810201273517190_n.jpg') no-repeat center center/cover;
            filter: brightness(0.4);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            text-align: center;
        }

        /* تنسيق اللوجو في المنتصف */
        .logo-container {
            margin-bottom: 45px;
        }

        .logo-img {
            max-width: 200px;
            width: 120%;
            height: auto;
            filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.4));
        }

        /* حاوية الأزرار */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            padding: 0 20px;
        }

        /* تصميم الأزرار الموحد بلون ذهبي أنيق متناسق مع الهوية */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(20, 20, 20, 0.75);
            border: 2px solid #d4af37;
            color: #fff;
            padding: 14px 20px;
            border-radius: 35px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn i {
            font-size: 22px;
            color: #d4af37;
            transition: transform 0.3s ease;
        }

        /* تأثيرات الحركة عند مرور الماوس */
        .btn:hover {
            background: #d4af37;
            color: #111;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        .btn:hover i {
            color: #111;
            transform: scale(1.1);
        }

        /* تصميم حقوق النشر في الأسفل */
      .footer-text {
            margin-top: 40px;
            color: #d4af37;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- اللوجو في المنتصف -->
        <div class="logo-container">
            <img src="NEW LOGOOO WASEEM.png" alt="شعار مجموعة مطاعم سلاف" class="logo-img">
        </div>

        <!-- أزرار التواصل والروابط -->
        <div class="links-container">
            <!-- زر فيسبوك -->
            <a href="https://www.facebook.com/Slav.restaurants/" target="_blank" class="btn">
                <i class="fab fa-facebook-f"></i>
                <span>صفحتنا على فيسبوك</span>
            </a>

            <!-- زر إنستغرام -->
            <a href="https://www.instagram.com/p/Db5v-oUtzV2/" target="_blank" class="btn">
                <i class="fab fa-instagram"></i>
                <span>تابعنا على إنستغرام</span>
            </a>

            <!-- زر الاتصال برقم الهاتف -->
            <div href="tel:0945055044" class="btn">
                <i class="fas fa-phone-alt"></i>
                <span>اتصل بنا: 0945055044</span>
            </div>
        </div>

        <!-- نص ترويجي أو حقوق -->
        <div class="footer-text">
            SLAV RESTAURANTS EST. 1988
        </div>
    </div>

</body>
</html>
